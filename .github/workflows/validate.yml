name: Validate catalog

# Runs the validator and test suite on every PR and on pushes to main that touch the
# catalog, schema, scripts, or tests. A red X here means the catalog or tests failed;
# merge only on green.
on:
  pull_request:
    paths:
      - "community-packs.json"
      - "schema/**"
      - "scripts/**"
      - "tests/**"
  push:
    branches: [main]
    paths:
      - "community-packs.json"
      - "schema/**"
      - "scripts/**"
      - "tests/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install jsonschema pytest
      - name: Run unit tests
        run: pytest
      - name: Validate community-packs.json
        run: python scripts/validate_catalog.py
